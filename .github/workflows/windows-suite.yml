name: Verify the Nilly Suite on Windows
on:
  push:
    paths:
      - '.github/workflows/windows-suite.yml'
      - 'desktop/**'
      - 'catalog.json'
      - 'Install_NillyHub.ps1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install-suite:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Hub and exercise the production installer for each release
        shell: powershell
        env:
          NILLYHUB_CI_RELEASES_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseToken = $env:NILLYHUB_CI_RELEASES_TOKEN
          Remove-Item Env:\NILLYHUB_CI_RELEASES_TOKEN
          if ([string]::IsNullOrWhiteSpace($releaseToken)) { throw 'GitHub Releases API token is unavailable' }
          & .\Install_NillyHub.ps1 -Silent
          $exe = (Resolve-Path .\NillyHub.exe).Path
          $assembly = [Reflection.Assembly]::LoadFrom($exe)
          $catalog = $assembly.GetType('NillyHub.SuiteCatalog', $true)
          $apps = $catalog.GetMethod('BuildDefaultCatalog').Invoke($null, $null)
          $root = $catalog.GetMethod('DetectSuiteRoot').Invoke($null, $null)
          $catalogJson = Get-Content -LiteralPath .\catalog.json -Raw -Encoding UTF8
          $catalogData = $catalogJson | ConvertFrom-Json
          $expectedRepos = @($catalogData.apps | ForEach-Object { [string]$_.repo })
          $mergeArgs = [object[]]::new(4)
          $mergeArgs[0] = $apps.PSObject.BaseObject
          $mergeArgs[1] = $catalogJson
          $mergeArgs[2] = $root
          $mergeArgs[3] = [string]$catalogData.suiteSizeLabel
          $env:NILLYHUB_CI_RELEASES_TOKEN = $releaseToken
          $releaseToken = $null
          try {
            [void]$catalog.GetMethod('MergeCatalogJson').Invoke($null, $mergeArgs)
          } finally {
            Remove-Item Env:\NILLYHUB_CI_RELEASES_TOKEN -ErrorAction SilentlyContinue
          }
          $install = $catalog.GetMethod('InstallOrUpdate')
          $refresh = $catalog.GetMethod('RefreshLocalState')
          $repos = @($apps | ForEach-Object { [string]$_.RepoName })
          if (-not $expectedRepos.Count -or $repos.Count -ne $expectedRepos.Count -or
              ($repos | Select-Object -Unique).Count -ne $repos.Count -or
              (Compare-Object $expectedRepos $repos)) {
            throw 'Windows installer catalog differs from catalog.json'
          }
          $progress = [Action[string]] { param($message) Write-Host $message }
          $failures = @()
          foreach ($app in $apps) {
            try {
              $install.Invoke($null, [object[]]@($app.PSObject.BaseObject, $progress))
              $refresh.Invoke($null, [object[]]@($app.PSObject.BaseObject, $root))
              if (-not $app.IsInstalled -or -not (Test-Path -LiteralPath $app.LocalLaunchPath -PathType Leaf)) {
                throw 'Launcher was not installed'
              }
              Write-Host "INSTALLED $($app.RepoName)"
            } catch {
              $failures += "$($app.RepoName): $($_.Exception.GetBaseException().Message)"
            }
          }
          if ($failures.Count) { throw ($failures -join [Environment]::NewLine) }
          Write-Host "SUITE_INSTALLED=$($repos.Count)/$($expectedRepos.Count)"

          $note = $apps | Where-Object { $_.RepoName -eq 'nillynote-pro' }
          if (-not $note) { throw 'Expected the NillyNote rollback fixture' }
          $sentinel = Join-Path $note.LocalDir 'previous-install.txt'
          Set-Content -LiteralPath $sentinel -Value 'preserve the original installation'
          $before = (Get-FileHash -LiteralPath $note.LocalLaunchPath -Algorithm SHA256).Hash
          $prefix = [string][char]0x039C + [char]0x03B5 + [char]0x03C4
          $failDuringInstall = [Action[string]] {
            param($message)
            if ($message.StartsWith($prefix, [StringComparison]::Ordinal)) { throw 'NILLY_QA_INJECTED_FAILURE' }
          }
          $failedAsIntended = $false
          try {
            $install.Invoke($null, [object[]]@($note.PSObject.BaseObject, $failDuringInstall))
          } catch {
            if ($_.ToString() -notmatch 'NILLY_QA_INJECTED_FAILURE' -and $_.Exception.GetBaseException().Message -notmatch 'NILLY_QA_INJECTED_FAILURE') {
              throw
            }
            $failedAsIntended = $true
          }
          if (-not $failedAsIntended -or -not (Test-Path -LiteralPath $sentinel) -or
              (Get-FileHash -LiteralPath $note.LocalLaunchPath -Algorithm SHA256).Hash -ne $before) {
            throw 'Rollback failed to restore the original installation'
          }
          Write-Host 'ROLLBACK_RESTORED=True'

          $log = Join-Path $env:RUNNER_TEMP 'nillyhub-smoke.txt'
          $preview = Join-Path $env:RUNNER_TEMP 'nillyhub.png'
          $process = Start-Process -FilePath $exe -ArgumentList ('--test-smoke "' + $log + '" "' + $preview + '"') -PassThru -Wait
          $result = Get-Content -LiteralPath $log
          $result | Write-Host
          if ($process.ExitCode -ne 0 -or $result -notcontains 'SMOKE_RESULT=PASS' -or $result -notcontains "LOCAL_INSTALLED=$($expectedRepos.Count)/$($expectedRepos.Count)" -or $result -notcontains 'WINDOW_OPENED_OK=True') {
            throw 'Hub did not open with all catalog tools installed'
          }
      - uses: actions/upload-artifact@v4
        with:
          name: hub-windows-preview
          path: ${{ runner.temp }}/nillyhub.png
